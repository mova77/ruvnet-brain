name: ntfy-alerts
# Pushes significant repo events to Stuart's phone via ntfy.sh (topic = Actions secret NTFY_TOPIC).
on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]
  watch:
    types: [started]
  workflow_run:
    # EVERY scheduled/CI workflow belongs here — gists-nightly failed 3 nights in a row (07-10..12)
    # in silence because it was missing from this list. Silent redness is the one banned failure mode.
    # 2026-09-26: "ci" removed — ci.yml runs only as a reusable workflow inside
    # release-candidate-preflight, so a workflow_run on "ci" never fires. The four scheduled jobs
    # below were unwatched (corpus-nightly-dispatch among them while protected-release failed 16 days).
    # canonical-qa is deliberately absent: it runs on every PR and would page on routine PR redness.
    # 2026-09-29: corpus-watchdog added — it is the one listener that pages when the corpus nightly
    # goes quiet (a green stand-down is invisible to a red-only alert on the dispatcher itself).
    workflows: ["release-candidate-preflight", "integration-linux", "gists-nightly", "protected-release",
                "corpus-nightly-dispatch", "published-surface-probe", "learning-replay", "model-catalog-refresh",
                "corpus-watchdog"]
    types: [completed]
# The notify job needs nothing from the repo — strip the token to read-nothing so an injected
# payload (were one ever to slip through again) has no credential to steal.
permissions: {}

# A NOTIFIER MUST NEVER BE ABLE TO STARVE THE THING IT NOTIFIES ABOUT (added 2026-08-06).
#
# Measured during the 4.0.19 release: this workflow had NO `timeout-minutes`. It fires on
# `workflow_run` for every CI workflow, so it is the most frequently launched job in the repo — and
# two of its runs sat `in_progress` from 16:19 and 16:23 with no progress, holding BOTH available
# concurrency slots while 21 real runs queued behind them. CI, integration, ux-qe, three PRs and the
# release candidate were all stalled for over ten minutes by a job whose entire purpose is to send
# one alert. Cancelling the two hung runs freed the queue immediately.
#
# Two guards, because they fail differently. `timeout-minutes` bounds a run that hangs (a slot is
# returned even in the worst case), and `concurrency` stops the pile-up: alerts are only worth
# sending about the LATEST state, so superseded ones should die rather than wait for a runner. A
# stale alert has no value, but a stale alert holding a runner has negative value.
concurrency:
  group: ntfy-alerts-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    # Generous for one HTTP POST, and still 1/12th of the time the hung runs above burned.
    timeout-minutes: 5
    steps:
      - name: send
        # SECURITY: issue/PR titles and user logins are ATTACKER-CONTROLLED on a public repo, and
        # this fires on pull_request_target. They must reach the shell only via env (quoted "$VAR"
        # expansion, never ${{ }} interpolation inside run:) or a crafted title executes here.
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_USER_TYPE: ${{ github.event.issue.user.type }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_USER_TYPE: ${{ github.event.pull_request.user.type }}
          SENDER: ${{ github.event.sender.login }}
          WR_CONC: ${{ github.event.workflow_run.conclusion }}
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_URL: ${{ github.event.workflow_run.html_url }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          [ -z "$TOPIC" ] && exit 0
          EVENT="${{ github.event_name }}"
          # PAGE ONLY WHAT NEEDS THE OWNER (2026-10-25: 10,747 notifications on this topic). Not paged:
          #  - issues/PRs opened by the owner's own account or a bot (Dream Cycle, release PRs, dependabot):
          #    nobody is waiting on them;
          #  - a run that was cancelled, skipped, or is waiting for approval: superseded or not a failure;
          #  - a red run on a working branch (dream/*, fix/*, PR checks): the work in progress reports there.
          # Paged: a person's new issue or PR, and a red run on main, a release/* branch (a release in flight,
          # possibly cut by the unattended responder) or a scheduled job.
          AUTHOR="${ISSUE_USER:-$PR_USER}"
          # Every bot account (login ends in [bot] or is an app/ login), not just two named ones.
          # GitHub's own account type is authoritative for bots; the login patterns are a fallback.
          if [ "$EVENT" != "workflow_run" ]; then
            [ "${ISSUE_USER_TYPE:-$PR_USER_TYPE}" = "Bot" ] && exit 0
            case "$AUTHOR" in stuinfla|*\[bot\]|app/*) exit 0 ;; esac
          fi
          case "$EVENT" in
            issues)
              TITLE="🐛 New issue #${ISSUE_NUM}"
              BODY="${ISSUE_TITLE} — by ${ISSUE_USER}"
              PRIO="high"; TAGS="warning" ;;
            pull_request_target)
              TITLE="🔀 New PR #${PR_NUM}"
              BODY="${PR_TITLE} — by ${PR_USER}"
              PRIO="high"; TAGS="git" ;;
            watch)
              TITLE="⭐ New star"
              BODY="${SENDER} starred ruvnet-brain"
              PRIO="default"; TAGS="star" ;;
            workflow_run)
              case "$WR_CONC" in success|cancelled|skipped|neutral|action_required|stale) exit 0 ;; esac
              case "$WR_BRANCH" in main|release/*) ;; *) [ "$WR_EVENT" != "schedule" ] && exit 0 ;; esac
              TITLE="🔴 CI ${WR_CONC}: ${WR_NAME}"
              BODY="branch ${WR_BRANCH} — ${WR_URL}"
              PRIO="urgent"; TAGS="rotating_light" ;;
          esac
          # This workflow is the only sender of arrival pages, so a failed delivery is retried and then fails the run
          # visibly (red in Actions) instead of vanishing (review round 2).
          # --retry (not --retry-all-errors): only transient failures are retried, which keeps the rare duplicate page
          # (a POST accepted but its reply lost) to a timeout case; a lost page is worse than a duplicate.
          curl -sS --fail --retry 3 --retry-delay 5 -m 20 \
            -H "Title: $TITLE" -H "Priority: $PRIO" -H "Tags: $TAGS" --data-raw "$BODY" "https://ntfy.sh/$TOPIC" >/dev/null
